<svg xmlns="http://www.w3.org/2000/svg" width="495" height="235" viewBox="0 0 495 235" role="img" aria-labelledby="vc-title vc-desc">
  <title id="vc-title">Activity by Day of Week</title>
  <desc id="vc-desc">Sessions · last 30 complete days</desc>
  <defs>
    <linearGradient id="vc-blue" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#79b8ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#79b8ff"/>
    </linearGradient>
    <linearGradient id="vc-green" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#56d4b0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#56d4b0"/>
    </linearGradient>
    <linearGradient id="vc-sheen">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .vc-sweep { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .vc-sweep { opacity: 1; animation: vc-sweep 3.5s linear infinite; }
    }
    @keyframes vc-sweep {
      from { transform: translateX(0); }
      to { transform: translateX(625px); }
    }
  </style>
