    <g id="vc-reveal-2" class="vc-reveal"><title>Other: 5 sessions</title><path d="M 116.9 91.6 A 76 76 0 0 1 120.0 91.5 L 120.0 112.5 A 55 55 0 0 0 117.7 112.5 Z" fill="#d29922"/></g><text x="120" y="162.5" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="700">760</text><text x="120" y="179.5" text-anchor="middle" fill="#9daec3" font-size="11">sessions</text><g><title>OpenAI</title><rect x="230" y="77" width="10" height="10" rx="2" fill="#58a6ff"/><text x="246" y="85" fill="#e6edf3" font-size="11">OpenAI</text><text x="246" y="98" fill="#9daec3" font-size="9">723 sessions · 95%</text></g>
    <g><title>Claude</title><rect x="230" y="109" width="10" height="10" rx="2" fill="#3fb950"/><text x="246" y="117" fill="#e6edf3" font-size="11">Claude</text><text x="246" y="130" fill="#9daec3" font-size="9">32 sessions · 4%</text></g>
    <g><title>Other</title><rect x="230" y="141" width="10" height="10" rx="2" fill="#d29922"/><text x="246" y="149" fill="#e6edf3" font-size="11">Other</text><text x="246" y="162" fill="#9daec3" font-size="9">5 sessions · 1%</text></g><defs>
