<g id="vc-reveal-0" class="vc-reveal"><title>OpenAI: 723 sessions</title><path d="M 120.0 91.5 A 76 76 0 1 1 97.1 95.0 L 103.4 115.1 A 55 55 0 1 0 120.0 112.5 Z" fill="#58a6ff"/></g>
