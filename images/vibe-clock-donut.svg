<svg xmlns="http://www.w3.org/2000/svg" width="495" height="270" viewBox="0 0 495 270" role="img" aria-labelledby="vc-title vc-desc">
  <title id="vc-title">Model Usage</title>
  <desc id="vc-desc">Share of sessions by model</desc>
  <defs>
    <linearGradient id="vc-blue" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#79b8ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#79b8ff"/>
    </linearGradient>
    <linearGradient id="vc-green" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#56d4b0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#56d4b0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .vc-x, .vc-y { transform-box: fill-box; }
    .vc-x { transform-origin: left center; }
    .vc-y { transform-origin: center bottom; }
    @media (prefers-reduced-motion: no-preference) {
      .vc-x { animation: vc-grow-x 600ms cubic-bezier(.22,1,.36,1) backwards; }
      .vc-y { animation: vc-grow-y 600ms cubic-bezier(.22,1,.36,1) backwards; }
      .vc-reveal { animation: vc-reveal 450ms ease-out backwards; }
    }
    @keyframes vc-grow-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes vc-grow-y { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes vc-reveal { from { opacity: 0; } to { opacity: 1; } }
  </style>
