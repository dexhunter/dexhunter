      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .vc-sweep { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .vc-sweep { opacity: 1; animation: vc-sweep 3.5s linear infinite; }
    }
    @keyframes vc-sweep {
      from { transform: translateX(0); }
      to { transform: translateX(625px); }
    }
  </style>
  <rect x="1" y="1" width="493" height="268" rx="14" fill="#0d1117" stroke="#293548"/>
