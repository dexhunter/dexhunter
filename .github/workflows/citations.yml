name: Update Scholar Badges

on:
  schedule:
    # Weekly: about 4 requests a month, leaving the rest of SerpApi's
    # 100-request free tier for the google-scholar-badge service.
    # Use workflow_dispatch for an on-demand refresh between runs.
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citation-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Google Scholar badges
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_SCHOLAR_USER_ID: 8Ez_u30AAAAJ
        run: |
          # One request carries citations, h-index and i10-index, so every
          # badge below is free once this call succeeds.
          response="$(curl --silent --show-error --get \
            --data-urlencode "engine=google_scholar_author" \
            --data-urlencode "author_id=${GOOGLE_SCHOLAR_USER_ID}" \
            --data-urlencode "api_key=${SERPAPI_API_KEY}" \
            --data-urlencode "hl=en" \
            https://serpapi.com/search.json)"

          fail() {
            reason="$(jq --raw-output '.error // "response contained no cited_by data"' \
              <<<"${response}" 2>/dev/null || echo "response was not valid JSON")"
            echo "::error::SerpApi did not return $1: ${reason}"
            echo "The badges keep their last committed values, which are now stale."
            exit 1
          }

          write_badge() {  # $1=path  $2=label  $3=value
            jq --null-input --arg label "$2" --arg message "$3" \
              '{
                schemaVersion: 1,
                label: $label,
                message: $message,
                color: "blue"
              }' > "$1"
          }

          # cited_by.table is a list of single-key rows in no guaranteed order,
          # so select the row holding the key rather than trusting position.
          metric() {  # $1 = table key
            jq --exit-status --raw-output --arg key "$1" \
              '[.cited_by.table[]?[$key].all // empty] | first' <<<"${response}"
          }

          citations="$(metric citations)" || fail "a citation count"
          h_index="$(metric h_index)"     || fail "an h-index"

          write_badge images/google-scholar-citations.json "Citations" "${citations}"
          write_badge images/google-scholar-h-index.json   "h-index"   "${h_index}"

          echo "citations=${citations}  h-index=${h_index}"

      - name: Commit updated badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/google-scholar-citations.json images/google-scholar-h-index.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update scholar badges"
          git push
