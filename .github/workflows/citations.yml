name: Update Citation Badge

on:
  schedule:
    # Weekly: about 4 requests a month, leaving the rest of SerpApi's
    # 100-request free tier for the google-scholar-badge service.
    # Use workflow_dispatch for an on-demand refresh between runs.
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citation-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Google Scholar citation badge
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_SCHOLAR_USER_ID: 8Ez_u30AAAAJ
        run: |
          response="$(curl --silent --show-error --get \
            --data-urlencode "engine=google_scholar_author" \
            --data-urlencode "author_id=${GOOGLE_SCHOLAR_USER_ID}" \
            --data-urlencode "api_key=${SERPAPI_API_KEY}" \
            --data-urlencode "hl=en" \
            https://serpapi.com/search.json)"

          fail() {
            reason="$(jq --raw-output '.error // "response contained no cited_by data"' \
              <<<"${response}" 2>/dev/null || echo "response was not valid JSON")"
            echo "::error::SerpApi did not return $1: ${reason}"
            echo "The badge keeps its last committed value, which is now stale."
            exit 1
          }

          # cited_by.table is a list of single-key rows in no guaranteed order,
          # so select the row holding the key rather than trusting position.
          metric() {  # $1 = table key
            jq --exit-status --raw-output --arg key "$1" \
              '[.cited_by.table[]?[$key].all // empty] | first' <<<"${response}"
          }

          citations="$(metric citations)" || fail "a citation count"

          jq --null-input --arg message "${citations}" \
            '{
              schemaVersion: 1,
              label: "Citations",
              message: $message,
              color: "blue"
            }' > images/google-scholar-citations.json

          echo "citations=${citations}"

      - name: Commit updated citation badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/google-scholar-citations.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update citation badge"
          git push
